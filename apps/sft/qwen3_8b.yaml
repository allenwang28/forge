# >>> python -m apps.sft.main --config apps/sft/qwen3_8b.yaml

# Config for supervised full finetuning using Qwen3 8B

model_name: "Qwen/Qwen3-8B"

# Trainer configuration
trainer:
  comm:
    trace_buf_size: 0
  model:
    name: qwen3
    flavor: 8B
    hf_assets_path: hf://${model_name}
  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8
  lr_scheduler:
    warmup_steps: 200
  training:
    local_batch_size: 1
    seq_len: 2048
    max_norm: 1.0
    steps: 1000
    dtype: bfloat16
  compile:
    enable: false
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: -1
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: false
  checkpoint:
    enable: true
    folder: ./checkpoint
    initial_load_path: hf://${model_name}
    initial_load_in_hf: true
    last_save_in_hf: true
    interval: 500
    async_mode: "disabled"
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

# Process configuration for trainer actor
processes:
  trainer:
    procs: 8
    with_gpus: true
    mesh_name: trainer

metric_logging:
  wandb:
    project: sft-training
    group: sft_exp_${oc.env:USER}
    logging_mode: global_reduce # global_reduce, per_rank_reduce, per_rank_no_reduce
