# >>> python -m tests.sandbox.vllm.main --config tests/sandbox/vllm/qwen3_30b_a3b.yaml

policy:
  engine_args:
    model: "Qwen/Qwen3-30B-A3B"
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    enable_expert_parallel: true
    enforce_eager: true
  sampling_params:
    n: 2
    max_tokens: 512

services:
  policy:
    procs: 4
    num_replicas: 1
    with_gpus: true


# Optional, otherwise argparse fallback kicks in
prompt: "Tell me a joke"
